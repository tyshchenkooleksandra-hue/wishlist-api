# Конфігурація лінтера лежить у репозиторії, тому локально й у CI правила однакові.
target-version = "py310"
line-length = 120

# Міграції Alembic згенеровані й залежать від порядку імпортів — лінтером не чіпаємо.
extend-exclude = ["alembic"]

[lint]
# E/W — стиль (pycodestyle), F — помилки (pyflakes), I — порядок імпортів, B — типові баги (bugbear)
select = ["E", "W", "F", "I", "B"]
# B008: Depends(...) у значеннях за замовчуванням — штатна ідіома FastAPI
# B904: raise усередині except без from — чужий код, поведінку не змінюємо
ignore = ["B008", "B904"]

[lint.per-file-ignores]
# run.py імпортує пакети лише щоб перевірити, чи вони встановлені
"run.py" = ["F401"]
