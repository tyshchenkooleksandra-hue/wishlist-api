name: CI

# Лише pull request і push у main: не на кожну подію підряд.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Конвеєру потрібно лише читати код.
permissions:
  contents: read

jobs:
  # Найдешевша перевірка — найраніше: без баз і за лічені секунди.
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install linter
        run: pip install -r requirements-dev.txt
      - name: Run ruff
        run: ruff check --output-format=github .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    # Тести не стартують, поки лінтер не пройшов.
    needs: lint
    runs-on: ubuntu-24.04
    strategy:
      # Падіння на одній версії Python не скасовує іншу: видно обидва результати.
      fail-fast: false
      matrix:
        # Рядки в лапках: без них YAML прочитає 3.10 як число 3.1.
        # Вище 3.11 не беремо: psycopg2-binary==2.9.7 не має готових збірок для новіших версій.
        python-version: ["3.10", "3.11"]

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: wishlist_test
        ports:
          - 5432:5432
        # Перевірка готовності: кроки не почнуться, доки контейнер не стане healthy.
        options: >-
          --health-cmd "pg_isready -U ci_user -d wishlist_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Підключення задається змінними середовища, а не правкою коду.
    env:
      DB_USER: ci_user
      DB_PASSWORD: ci_password
      DB_HOST: localhost
      DB_NAME: wishlist_test
      DB_SSLMODE: disable
      REDIS_URL: redis://localhost:6379
      SECRET_KEY: ci-only-not-a-real-secret
      ALGORITHM: HS256

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests with coverage
        run: pytest -v --cov=. --cov-report=term-missing --cov-report=xml --cov-report=html
      - name: Upload coverage report
        # always(): звіт потрібен саме тоді, коли тести впали.
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: |
            coverage.xml
            htmlcov/
          retention-days: 14
          if-no-files-found: warn
